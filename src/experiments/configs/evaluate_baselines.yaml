# 基准算法比较配置文件

output_dir: src/baseline_results

# 评估配置
evaluation:
  num_episodes: 10
  max_steps_per_episode: 200
  num_runs: 1
  scenarios:
    - earthquake
  severities:
    - medium

# 环境配置 - 小规模快速测试
environment:
  map_size: [1000, 1000]
  num_agents: 20
  num_victims: 200
  num_resources: 10
  num_hospitals: 3
  disaster_type: earthquake
  severity: medium

# 算法配置 - 真实基线对比
algorithms:
  # 核心对比算法
  egt_marl:
    enabled: true
    model_path: "experiment_results/egt_marl_20260620_210828/models/best_model.pt"
  
  qmix:
    enabled: false  # 暂时禁用，初始化参数复杂
  
  # 传统启发式算法（已正确实现）
  fcfs:
    enabled: true
  priority:
    enabled: true
  greedy_local:
    enabled: true
  proportional_fair:
    enabled: true
  
  # 未实现的算法（暂时禁用）
  centralized_mpc:
    enabled: false
  standard_marl:
    enabled: false
  game_theoretic:
    enabled: false
  gnn_based:
    enabled: false
  transformer_based:
    enabled: false