# 基准算法比较配置文件

output_dir: baseline_results

# 评估配置 - 严格评估（论文标准）
evaluation:
  num_episodes: 30
  max_steps_per_episode: 200
  num_runs: 3
  scenarios:
    - earthquake
  severities:
    - medium

# 环境配置 - 小规模快速测试
environment:
  map_size: [1000, 1000]
  num_agents: 17
  num_victims: 200
  num_resources: 10
  num_hospitals: 3
  disaster_type: earthquake
  severity: medium

# 算法配置 - 完整基线对比
algorithms:
  # 核心对比算法
  egt_marl:
    enabled: true
    model_path: "src/experiment_results/egt_marl_20260620_210828/models/best_model.pt"
  
  qmix:
    enabled: false
  
  # 传统启发式算法
  fcfs:
    enabled: true
  priority:
    enabled: true
  greedy_local:
    enabled: true
  proportional_fair:
    enabled: true
  
  # 论文定义的基线算法
  centralized_mpc:
    enabled: true
  standard_marl:
    enabled: true
  game_theoretic:
    enabled: true
  
  # 未实现
  gnn_based:
    enabled: false
  transformer_based:
    enabled: false