# 快速 smoke test 配置 (300 episodes,小地图)
# 用于训练前的冒烟测试 / CI 回归 / Debug

# 训练参数
training:
  num_episodes: 300          # 300个episodes
  max_steps_per_episode: 800  # 延长每轮步数
  batch_size: 32
  buffer_size: 10000          # 增大经验回放缓冲区
  gamma: 0.99
  tau: 0.01
  learning_rate: 0.0005       # 降低学习率
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.99
  target_update_interval: 50   # 加快目标网络更新
  checkpoint_interval: 100
  eval_interval: 50
  num_eval_episodes: 10
  save_best_model: true
  update_frequency: 10

# 环境参数
environment:
  map_size: [1500, 1500]      # 增大地图
  num_agents: 25              # 增加智能体数量
  num_victims: 250            # 增加受害者数量
  num_resources: 12            # 增加资源种类
  num_areas: 4
  disaster_type: earthquake
  severity: medium

# 算法参数
algorithm:
  hidden_dim: 256              # 增大隐藏层维度
  mixing_hidden_dim: 128       # 增大混合网络维度
  attention_heads: 4
  egt_lambda: 0.5
  pareto_weight_alpha: 0.3
  pareto_weight_beta: 0.4
  pareto_weight_gamma: 0.3
  anti_spoofing_enabled: true  # 启用抗欺骗模块
  egt_enabled: true            # 启用EGT层

# EGT 演化博弈层配置（被 algo_config['egt'] 读取）
# 注意：与 src/environments/config/constants.py 的 NUM_STRATEGIES (== 3) 保持一致
egt:
  num_strategies: 3
  learning_rate: 0.01
  mutation_rate: 0.05
  selection_pressure: 2.0
  population_size: 100
  tradeoff_adaptation_rate: 0.1
  min_fairness_weight: 0.2
  max_fairness_weight: 0.8
  replicator_dynamics: true
  fitness_sharing: true
  niching_radius: 0.1