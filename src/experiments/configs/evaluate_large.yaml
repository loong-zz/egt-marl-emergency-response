# 大规模评估配置 - 扩展性测试

output_dir: src/evaluation_results

# 评估配置
evaluation:
  num_episodes: 10           # 保持一致
  max_steps_per_episode: 1200 # 与训练一致
  num_runs: 1                # 单轮运行
  scenarios:
    - earthquake
  severities:
    - medium

# 环境配置 - 与训练配置完全一致
environment:
  map_size: [4500, 4500]     # 与训练一致
  num_agents: 100            # 与训练一致
  num_victims: 1000          # 与训练一致
  num_resources: 48          # 与训练一致
  num_hospitals: 16          # 与训练一致
  disaster_type: earthquake  # 与训练一致
  severity: medium

# 算法配置
algorithms:
  egt_marl:
    enabled: true
    model_path: "/mnt/e/studio/workspace/egt-marl-emergency-response/src/experiment_results/egt_marl_20260427_152624/models/best_model.pt"
  qmix:
    enabled: true
    model_path: ""
    hidden_dim: 128
    mixing_hidden_dim: 64
    learning_rate: 0.0001
  fcfs:
    enabled: true
  priority:
    enabled: true
  greedy_local:
    enabled: true
  proportional_fair:
    enabled: true
  centralized_mpc:
    enabled: true
  game_theoretic:
    enabled: true
  gnn_based:
    enabled: true
  transformer_based:
    enabled: true
