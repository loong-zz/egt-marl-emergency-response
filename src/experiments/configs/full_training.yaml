training:
  num_episodes: 200
  max_steps_per_episode: 300
  batch_size: 64
  buffer_size: 50000
  gamma: 0.99
  tau: 0.01
  learning_rate: 0.0003
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.98
  target_update_interval: 100
  checkpoint_interval: 50
  eval_interval: 20
  num_eval_episodes: 10
  save_best_model: true
  update_frequency: 10

environment:
  map_size: [8000, 8000]
  num_agents: 20
  num_victims: 100
  num_resources: 4
  num_hospitals: 2
  disaster_type: earthquake
  severity: medium

algorithm:
  hidden_dim: 128
  mixing_hidden_dim: 128
  attention_heads: 4
  egt_lambda: 0.5
  pareto_weight_alpha: 0.3
  pareto_weight_beta: 0.4
  pareto_weight_gamma: 0.3
  anti_spoofing_enabled: false
  egt_enabled: true