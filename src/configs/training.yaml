# Training Configuration
# Ultra-compact configuration based on observed fast convergence (~600 episodes)
# All phases completed within 1500 episodes total

# Experiment setup
experiment:
  name: "egt_marl_disaster_fast"
  description: "Fast-converging EGT-MARL training for disaster response"
  seed: 42
  device: "cuda"
  num_workers: 4
  
# Training schedule - Ultra-compact phases
schedule:
  phases:
    - name: "warmup"
      episodes: 400  # Shortened: model learns basics quickly
      learning_rate: 0.0001
      exploration_rate: 0.8  # Start with high exploration
      difficulty: 0.3
      
    - name: "main_training"
      episodes: 700  # Main learning completed quickly
      learning_rate: 0.0001
      exploration_rate: 0.1
      difficulty: 0.7
      
    - name: "fine_tuning"
      episodes: 400  # Quick fine-tuning for final polish
      learning_rate: 0.00001
      exploration_rate: 0.01
      difficulty: 1.0
  
  # Learning rate scheduling
  lr_schedule:
    type: "cosine"
    warmup_episodes: 100
    min_lr: 1e-6
    max_lr: 0.0001
    
  # Fast exploration decay
  exploration_schedule:
    type: "exponential"
    start: 0.8
    end: 0.01
    decay: 0.99  # Faster decay since model converges quickly

# Environment configuration
environment:
  scenario: "earthquake_standard"
  render: false
  render_frequency: 200
  save_replays: false  # Disable for speed
  replay_frequency: 1000
  
  variations:
    enabled: true
    types:
      - "resource_scarcity"
      - "communication_failure"
      - "agent_failure"
      - "dynamic_tasks"
    probability: 0.1

# Evaluation configuration
evaluation:
  frequency: 50
  num_evaluation_episodes: 5  # Reduced for speed
  scenarios:
    - "earthquake_standard"
    - "flood_moderate"
    
  baselines:
    - name: "FCFS"
      type: "first_come_first_served"
    - name: "Priority"
      type: "priority_based"
      priority_weights:
        urgency: 0.6
        distance: 0.3
        resources: 0.1
  
  metrics:
    primary:
      - "total_survivors"
      - "gini_coefficient"
      - "mean_response_time"
    secondary:
      - "resource_utilization"

# Model saving and checkpointing
checkpoint:
  enabled: true
  frequency: 200
  keep_last: 5
  
  save:
    - "model_state"
    - "optimizer_state"
    - "training_metrics"
    - "configuration"
    
  directory: "checkpoints/{experiment_name}/{timestamp}"
  format: "checkpoint_{episode:06d}.pt"

# Early stopping - Aggressive early stopping
early_stopping:
  enabled: true
  patience: 150  # Quick stop if no improvement
  min_delta: 0.001
  monitor: "rescue_rate"
  mode: "max"
  min_episodes: 300  # Start checking early

# Logging and visualization
logging:
  console:
    enabled: true
    level: "INFO"
    format: "[{asctime}] [{levelname}] {message}"
    
  file:
    enabled: true
    level: "INFO"  # Reduced log level
    directory: "logs/{experiment_name}"
    max_files: 5
    max_file_size: "5MB"
    
  tensorboard:
    enabled: false  # Disable for speed
    
  wandb:
    enabled: false

# Resource monitoring
monitoring:
  enabled: false  # Disable for speed

# Post-training analysis
analysis:
  enabled: true
  generate_report: true
  report_format: "html"
  
  analyses:
    - "learning_curves"
    - "policy_visualization"
    - "fairness_analysis"
    
  visualization:
    figsize: [12, 8]
    dpi: 150
    style: "seaborn"
    color_palette: "viridis"
