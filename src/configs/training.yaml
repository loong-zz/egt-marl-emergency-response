# Training Configuration
# Complete refactoring configuration for EGT-MARL disaster response
# Target: Rescue Rate >80%, Total 1500 episodes

# Experiment setup
experiment:
  name: "egt_marl_disaster_refactored"
  description: "EGT-MARL training with refactored configuration - targeting >80% rescue rate"
  seed: 42
  device: "cuda"
  num_workers: 4
  
# Training schedule - Four phases with dynamic lambda adjustment
# LR follows curriculum learning: warmup (high LR) -> transition (standard) ->
# main (lower) -> fine_tune (minimal). Decreasing ratio is 2.0/1.0/0.5/0.1
# of base_lr, matching the default schedule in train_egt_marl.py.
schedule:
  phases:
    - name: "warmup"
      episodes: 400
      learning_rate: 0.0002    # 2x base_lr: aggressive exploration
      exploration_rate: 0.8
      difficulty: 0.3
      lambda: 0.9  # Focus on efficiency first
    - name: "transition"  # New transition phase
      episodes: 200
      learning_rate: 0.0001    # 1x base_lr: standard
      exploration_rate: 0.3
      difficulty: 0.4
      lambda: 0.8  # Start balancing fairness
    - name: "main_training"
      episodes: 600
      learning_rate: 0.00005   # 0.5x base_lr: conservative refinement
      exploration_rate: 0.1
      difficulty: 0.5
      lambda: 0.7  # Balance efficiency and fairness
    - name: "fine_tuning"
      episodes: 300
      learning_rate: 0.00001   # 0.1x base_lr: minimal perturbation
      exploration_rate: 0.05
      difficulty: 0.7
      lambda: 0.6  # More focus on fairness
  
  # Learning rate scheduling
  lr_schedule:
    type: "cosine"
    warmup_episodes: 100
    min_lr: 1e-6
    max_lr: 0.0001
    
  # Optimized exploration decay: decay=0.997 gives 30% at episode 400, 2% at episode 1500
  exploration_schedule:
    type: "exponential"
    start: 0.8
    end: 0.05
    decay: 0.997  # Slower decay for better exploration

# Environment configuration
environment:
  scenario: "earthquake_standard"
  render: false
  render_frequency: 200
  save_replays: false  # Disable for speed
  replay_frequency: 1000

  # Critical fix: explicit environment params. Without these, train_egt_marl.py
  # falls back to defaults (num_agents=20, num_resources=10). With num_resources
  # > 2, DisasterSim now spreads depots on a grid (see _initialize_resource_depots).
  map_size: [1000, 1000]
  num_agents: 20
  num_victims: 200
  num_resources: 4
  num_areas: 3
  disaster_type: "earthquake"
  severity: "medium"

  variations:
    enabled: true
    types:
      - "resource_scarcity"
      - "communication_failure"
      - "agent_failure"
      - "dynamic_tasks"
    probability: 0.1

# Evaluation configuration
evaluation:
  frequency: 50
  num_evaluation_episodes: 5  # Reduced for speed
  scenarios:
    - "earthquake_standard"
    - "flood_moderate"
    
  baselines:
    - name: "FCFS"
      type: "first_come_first_served"
    - name: "Priority"
      type: "priority_based"
      priority_weights:
        urgency: 0.6
        distance: 0.3
        resources: 0.1
  
  metrics:
    primary:
      - "total_survivors"
      - "gini_coefficient"
      - "mean_response_time"
    secondary:
      - "resource_utilization"

# Model saving and checkpointing
checkpoint:
  enabled: true
  frequency: 150  # More frequent checkpoints for better recovery
  keep_last: 5
  
  save:
    - "model_state"
    - "optimizer_state"
    - "training_metrics"
    - "configuration"
    
  directory: "checkpoints/{experiment_name}/{timestamp}"
  format: "checkpoint_{episode:06d}.pt"

# Early stopping - Aggressive early stopping
early_stopping:
  enabled: true
  patience: 150  # Quick stop if no improvement
  min_delta: 0.001
  monitor: "rescue_rate"
  mode: "max"
  min_episodes: 300  # Start checking early

# Logging and visualization
logging:
  console:
    enabled: true
    level: "INFO"
    format: "[{asctime}] [{levelname}] {message}"
    
  file:
    enabled: true
    level: "INFO"  # Reduced log level
    directory: "logs/{experiment_name}"
    max_files: 5
    max_file_size: "5MB"
    
  tensorboard:
    enabled: false  # Disable for speed
    
  wandb:
    enabled: false

# Resource monitoring
monitoring:
  enabled: false  # Disable for speed

# EGT 演化博弈层配置（被 algo_config['egt'] 读取）
# 注意：与 src/environments/config/constants.py 的 NUM_STRATEGIES (== 3) 保持一致
egt:
  num_strategies: 3
  learning_rate: 0.01
  mutation_rate: 0.05
  selection_pressure: 2.0
  population_size: 100
  tradeoff_adaptation_rate: 0.1
  min_fairness_weight: 0.2
  max_fairness_weight: 0.8
  replicator_dynamics: true
  fitness_sharing: true
  niching_radius: 0.1

# Post-training analysis
analysis:
  enabled: true
  generate_report: true
  report_format: "html"
  
  analyses:
    - "learning_curves"
    - "policy_visualization"
    - "fairness_analysis"
    
  visualization:
    figsize: [12, 8]
    dpi: 150
    style: "seaborn"
    color_palette: "viridis"
