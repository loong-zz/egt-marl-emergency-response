# Evaluation Configuration for Baseline Comparison
# Using same parameters as training for model compatibility

evaluation:
  num_episodes: 50
  max_steps_per_episode: 1200
  num_runs: 5
  scenarios:
    - earthquake
  severities:
    - medium

algorithms:
  egt_marl:
    enabled: false
    model_path: "experiment_results/egt_marl_20260613_122050/models/best_model.pt"
  fcfs:
    enabled: true
  priority:
    enabled: true
  greedy_local:
    enabled: true
  proportional_fair:
    enabled: true

environment:
  map_size: [1000, 1000]
  num_agents: 17  # 10 drones + 5 ambulances + 2 hospitals (matches training)
  num_victims: 200
  num_resources: 10
  num_hospitals: 3
  disaster_type: earthquake
  severity: medium

output_dir: "evaluation_results"
